[package]
name = "gtk-theme"
version = "0.1.0"
edition = "2021"
authors = ["Kevin Hinds <https://github.com/khinds10>"]
description = "Shared color profiles and Adwaita icon helpers for the GTK4 apps suite"
license = "GPL-3.0-or-later"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
dirs = "5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
