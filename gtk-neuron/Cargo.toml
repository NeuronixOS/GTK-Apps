[package]
name = "gtk-neuron"
version = "0.1.0"
edition = "2021"
authors = ["Kevin Hinds <https://github.com/NeuronixOS/GTK-Apps>"]
description = "AI Self Driving layer for Neuronix GTK apps (daemon + client + Self Driving UI)"
license = "GPL-3.0-or-later"
readme = "README.md"

[lib]
name = "gtk_neuron"
path = "src/lib.rs"

[[bin]]
name = "gtk-neurond"
path = "src/bin/gtk-neurond.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "5"
ureq = { version = "2", features = ["json"] }
gtk-theme = { path = "../gtk-theme" }

[profile.release]
lto = true
strip = true
opt-level = "z"
