[package]
name = "gtk-theme-editor"
version = "0.1.0"
edition = "2021"
authors = ["Kevin Hinds <https://github.com/NeuronixOS/GTK-Apps>"]
description = "GTK4 front-end to load, live-tweak, and save GTK-Apps suite color profiles"
license = "GPL-3.0-or-later"
readme = "README.md"

[[bin]]
name = "gtk-theme-editor"
path = "src/main.rs"

[dependencies]
gtk4 = { version = "0.9", features = ["v4_10"] }
gtk-theme = { path = "../gtk-theme" }

[profile.release]
lto = true
strip = true
opt-level = "z"
